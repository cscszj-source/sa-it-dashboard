<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南非IT需求进度看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
.header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 28px 40px; }
.header h1 { font-size: 26px; font-weight: 600; }
.header p { font-size: 14px; opacity: 0.85; margin-top: 6px; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
.summary-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
.summary-card .num { font-size: 36px; font-weight: 700; }
.summary-card .label { font-size: 13px; color: #666; margin-top: 4px; }
.num-blue { color: #1a73e8; }
.num-green { color: #0d9f4f; }
.num-orange { color: #e8850a; }
.num-red { color: #d93025; }
.num-purple { color: #7b1fa2; }
.num-teal { color: #00897b; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.chart-card h3 { font-size: 15px; color: #444; margin-bottom: 16px; }
.bar-group { margin-bottom: 10px; display: flex; align-items: center; }
.bar-label { width: 110px; font-size: 13px; color: #555; flex-shrink: 0; text-align: right; padding-right: 12px; }
.bar-track { flex: 1; height: 26px; background: #f0f0f0; border-radius: 13px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 13px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; color: white; font-weight: 600; min-width: 30px; transition: width 0.6s ease; }
.filter-bar { background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.filter-bar label { font-size: 13px; color: #666; font-weight: 500; }
.filter-bar select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; }
.filter-bar input { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; width: 220px; }
.table-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
.table-card h3 { font-size: 15px; color: #444; padding: 16px 20px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: #f8f9fa; padding: 12px 10px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #e8eaed; white-space: nowrap; }
tbody td { padding: 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
tbody tr:hover { background: #f8f9ff; }
.req-desc { max-width: 260px; line-height: 1.5; }
.progress-cell { max-width: 300px; font-size: 12px; color: #555; line-height: 1.5; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge-online { background: #e6f4ea; color: #137333; }
.badge-dev { background: #fef7e0; color: #b06000; }
.badge-confirm { background: #e8f0fe; color: #1967d2; }
.badge-received { background: #f3e8fd; color: #7b1fa2; }
.badge-rejected { background: #fce8e6; color: #c5221f; }
.badge-merged { background: #e0f2f1; color: #00695c; }
.pri { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.pri-p0 { background: #fce8e6; color: #c5221f; }
.pri-p1 { background: #fef7e0; color: #b06000; }
.pri-p2 { background: #e8f0fe; color: #1967d2; }
.pri-p3 { background: #f0f0f0; color: #666; }
.domain-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #f0f0f0; color: #555; }
.footer { text-align: center; padding: 20px; font-size: 12px; color: #999; }
@media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } .summary-row { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="header">
  <h1>南非IT需求进度看板</h1>
  <p>数据来源: 南非需求跟进表 | 更新时间: 2026-10-10</p>
</div>
<div class="container">
  <div class="summary-row" id="summaryRow"></div>
  <div class="charts-row">
    <div class="chart-card"><h3>按业务域分布</h3><div id="domainChart"></div></div>
    <div class="chart-card"><h3>按状态分布</h3><div id="statusChart"></div></div>
  </div>
  <div class="charts-row">
    <div class="chart-card"><h3>按优先级分布</h3><div id="priorityChart"></div></div>
    <div class="chart-card"><h3>按涉及品牌分布</h3><div id="brandChart"></div></div>
  </div>
  <div class="filter-bar">
    <label>筛选:</label>
    <select id="filterDomain" onchange="applyFilters()"><option value="">全部业务域</option></select>
    <select id="filterStatus" onchange="applyFilters()"><option value="">全部状态</option></select>
    <select id="filterPriority" onchange="applyFilters()"><option value="">全部优先级</option></select>
    <input type="text" id="filterSearch" placeholder="搜索需求说明/提出人..." oninput="applyFilters()">
  </div>
  <div class="table-card">
    <table>
      <thead><tr><th>#</th><th>业务域</th><th>需求说明</th><th>优先级</th><th>状态</th><th>提出人</th><th>涉及品牌</th><th>产品经理</th><th>对应系统</th><th>当前进展</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="footer">南非IT需求进度可视化看板 | 数据基于飞书南非需求跟进表</div>
</div>
<script>
var DATA = [];

var statusMap = {"需求已上线":"badge-online","需求开发中":"badge-dev","需求确认中":"badge-confirm","需求已接收":"badge-received","需求拒绝":"badge-rejected","需求已合并":"badge-merged"};
var priMap = {"P0":"pri-p0","P1":"pri-p1","P2":"pri-p2","P3":"pri-p3"};

function countBy(arr, idx) {
  var m = {};
  arr.forEach(function(r) { var v = r[idx] || "-"; m[v] = (m[v]||0)+1; });
  return Object.entries(m).sort(function(a,b){return b[1]-a[1];});
}

function renderSummary(data) {
  var total = data.length;
  var online = data.filter(function(r){return r[3]==="需求已上线";}).length;
  var dev = data.filter(function(r){return r[3]==="需求开发中";}).length;
  var confirm = data.filter(function(r){return r[3]==="需求确认中";}).length;
  var received = data.filter(function(r){return r[3]==="需求已接收";}).length;
  var rejected = data.filter(function(r){return r[3]==="需求拒绝";}).length;
  var merged = data.filter(function(r){return r[3]==="需求已合并";}).length;
  document.getElementById("summaryRow").innerHTML = 
    '<div class="summary-card"><div class="num num-blue">'+total+'</div><div class="label">总需求数</div></div>'+
    '<div class="summary-card"><div class="num num-green">'+online+'</div><div class="label">已上线</div></div>'+
    '<div class="summary-card"><div class="num num-orange">'+dev+'</div><div class="label">开发中</div></div>'+
    '<div class="summary-card"><div class="num num-purple">'+received+'</div><div class="label">已接收</div></div>'+
    '<div class="summary-card"><div class="num num-blue">'+confirm+'</div><div class="label">确认中</div></div>'+
    '<div class="summary-card"><div class="num num-red">'+rejected+'</div><div class="label">已拒绝</div></div>'+
    '<div class="summary-card"><div class="num num-teal">'+merged+'</div><div class="label">已合并</div></div>';
}

function renderBarChart(containerId, entries, colors) {
  var max = Math.max.apply(null, entries.map(function(e){return e[1];})) || 1;
  var el = document.getElementById(containerId);
  var html = "";
  for (var i = 0; i < entries.length; i++) {
    var label = entries[i][0], count = entries[i][1];
    var pct = (count/max*100).toFixed(0);
    var color = colors[i % colors.length];
    html += '<div class="bar-group"><div class="bar-label">'+label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'">'+count+'</div></div></div>';
  }
  el.innerHTML = html;
}

var barColors = ["#1a73e8","#0d9f4f","#e8850a","#d93025","#7b1fa2","#00897b","#f4511e","#6d4c41","#546e7a"];

function renderCharts(data) {
  renderBarChart("domainChart", countBy(data, 0), barColors);
  renderBarChart("statusChart", countBy(data, 3), ["#137333","#b06000","#7b1fa2","#1967d2","#c5221f","#00695c"]);
  renderBarChart("priorityChart", countBy(data, 2), ["#c5221f","#b06000","#1967d2","#666"]);
  renderBarChart("brandChart", countBy(data, 4), barColors);
}

function populateFilters() {
  var domains = [], statuses = [], priorities = [];
  DATA.forEach(function(r) {
    if (domains.indexOf(r[0])<0) domains.push(r[0]);
    if (statuses.indexOf(r[3])<0) statuses.push(r[3]);
    if (priorities.indexOf(r[2])<0) priorities.push(r[2]);
  });
  domains.sort(); statuses.sort(); priorities.sort();
  var dSel = document.getElementById("filterDomain");
  domains.forEach(function(d) { var o = document.createElement("option"); o.value=d; o.textContent=d; dSel.appendChild(o); });
  var sSel = document.getElementById("filterStatus");
  statuses.forEach(function(s) { var o = document.createElement("option"); o.value=s; o.textContent=s; sSel.appendChild(o); });
  var pSel = document.getElementById("filterPriority");
  priorities.forEach(function(p) { var o = document.createElement("option"); o.value=p; o.textContent=p; pSel.appendChild(o); });
}

function renderTable(data) {
  var tbody = document.getElementById("tableBody");
  var html = "";
  for (var i = 0; i < data.length; i++) {
    var r = data[i];
    var sc = statusMap[r[3]] || "badge-confirm";
    var pc = priMap[r[2]] || "pri-p3";
    var progressText = r[8] && r[8].length > 80 ? r[8].substring(0,80)+"..." : (r[8]||"-");
    html += '<tr><td>'+(i+1)+'</td><td><span class="domain-tag">'+r[0]+'</span></td><td class="req-desc">'+r[1]+'</td><td><span class="pri '+pc+'">'+r[2]+'</span></td><td><span class="badge '+sc+'">'+r[3]+'</span></td><td>'+r[4]+'</td><td>'+r[5]+'</td><td>'+r[6]+'</td><td>'+r[7]+'</td><td class="progress-cell" title="'+r[8]+'">'+progressText+'</td></tr>';
  }
  tbody.innerHTML = html;
}

function applyFilters() {
  var d = document.getElementById("filterDomain").value;
  var s = document.getElementById("filterStatus").value;
  var p = document.getElementById("filterPriority").value;
  var q = document.getElementById("filterSearch").value.toLowerCase();
  var filtered = DATA.filter(function(r) {
    if (d && r[0] !== d) return false;
    if (s && r[3] !== s) return false;
    if (p && r[2] !== p) return false;
    if (q && r[1].toLowerCase().indexOf(q)<0 && r[5].toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  renderSummary(filtered);
  renderCharts(filtered);
  renderTable(filtered);
}

renderSummary(DATA);
renderCharts(DATA);
populateFilters();
renderTable(DATA);
</script>
</body>
</html>
