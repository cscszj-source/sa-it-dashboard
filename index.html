function renderSummary(data) { var total = data.length; var online = data.filter(function(r){return r[3]==="需求已上线";}).length; var dev = data.filter(function(r){return r[3]==="需求开发中";}).length; var received = data.filter(function(r){return r[3]==="需求已接收";}).length; var confirm = data.filter(function(r){return r[3]==="需求确认中";}).length; var rejected = data.filter(function(r){return r[3]==="需求拒绝";}).length; var merged = data.filter(function(r){return r[3]==="需求已合并";}).length; document.getElementById("summaryRow").innerHTML = '<div class="summary-card"><div class="num num-blue">'+total+'</div><div class="label">总需求数</div></div><div class="summary-card"><div class="num num-green">'+online+'</div><div class="label">已上线</div></div><div class="summary-card"><div class="num num-orange">'+dev+'</div><div class="label">开发中</div></div><div class="summary-card"><div class="num num-purple">'+received+'</div><div class="label">已接收</div></div><div class="summary-card"><div class="num num-blue">'+confirm+'</div><div class="label">确认中</div></div><div class="summary-card"><div class="num num-red">'+rejected+'</div><div class="label">已拒绝</div></div><div class="summary-card"><div class="num num-teal">'+merged+'</div><div class="label">已合并</div></div>'; }
function renderBarChart(containerId, entries, colors) { var max = Math.max.apply(null, entries.map(function(e){return e[1];})) || 1; var el = document.getElementById(containerId); var html = ""; for (var i = 0; i < entries.length; i++) { var label = entries[i][0], count = entries[i][1]; var pct = (count/max*100).toFixed(0); var color = colors[i % colors.length]; html += '<div class="bar-group"><div class="bar-label">'+label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'">'+count+'</div></div></div>'; } el.innerHTML = html; }
var barColors = ["#1a73e8","#0d9f4f","#e8850a","#d93025","#7b1fa2","#00897b","#f4511e","#6d4c41","#546e7a"];
function renderCharts(data) { renderBarChart("domainChart", countBy(data, 0), barColors); renderBarChart("statusChart", countBy(data, 3), ["#137333","#b06000","#7b1fa2","#1967d2","#c5221f","#00695c"]); renderBarChart("priorityChart", countBy(data, 2), ["#c5221f","#b06000","#1967d2","#666"]); renderBarChart("brandChart", countBy(data, 5), barColors); }
function populateFilters() { var domains = [], statuses = [], priorities = []; DATA.forEach(function(r) { if (domains.indexOf(r[0])<0) domains.push(r[0]); if (statuses.indexOf(r[3])<0) statuses.push(r[3]); if (priorities.indexOf(r[2])<0) priorities.push(r[2]); }); domains.sort(); statuses.sort(); priorities.sort(); var dSel = document.getElementById("filterDomain"); domains.forEach(function(d) { var o = document.createElement("option"); o.value=d; o.textContent=d; dSel.appendChild(o); }); var sSel = document.getElementById("filterStatus"); statuses.forEach(function(s) { var o = document.createElement("option"); o.value=s; o.textContent=s; sSel.appendChild(o); }); var pSel = document.getElementById("filterPriority"); priorities.forEach(function(p) { var o = document.createElement("option"); o.value=p; o.textContent=p; pSel.appendChild(o); }); }
function renderTable(data) { var tbody = document.getElementById("tableBody"); var html = ""; for (var i = 0; i < data.length; i++) { var r = data[i]; var sc = statusMap[r[3]] || "badge-confirm"; var pc = priMap[r[2]] || "pri-p3"; var progressText = r[8] && r[8].length > 80 ? r[8].substring(0,80)+"..." : (r[8]||"-"); html += '<tr><td>'+(i+1)+'</td><td><span class="domain-tag">'+r[0]+'</span></td><td class="req-desc">'+r[1]+'</td><td><span class="pri '+pc+'">'+r[2]+'</span></td><td><span class="badge '+sc+'">'+r[3]+'</span></td><td>'+r[4]+'</td><td>'+r[5]+'</td><td>'+r[6]+'</td><td>'+r[7]+'</td><td class="progress-cell" title="'+r[8]+'">'+progressText+'</td></tr>'; } tbody.innerHTML = html; }
function applyFilters() { var d = document.getElementById("filterDomain").value; var s = document.getElementById("filterStatus").value; var p = document.getElementById("filterPriority").value; var q = document.getElementById("filterSearch").value.toLowerCase(); var filtered = DATA.filter(function(r) { if (d && r[0] !== d) return false; if (s && r[3] !== s) return false; if (p && r[2] !== p) return false; if (q && r[1].toLowerCase().indexOf(q)<0 && r[4].toLowerCase().indexOf(q)<0) return false; return true; }); renderSummary(filtered); renderCharts(filtered); renderTable(filtered); }
renderSummary(DATA); renderCharts(DATA); populateFilters(); renderTable(DATA);
</script>
