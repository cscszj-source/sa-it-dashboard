.num-purple { color: #7b1fa2; }
.num-teal { color: #00897b; }

/* ====== 翻译辅助函数 ====== */
function trDomain(v) { return currentLang === 'en' ? (DOMAIN_EN[v] || v) : v; }
function trStatus(v) { return currentLang === 'en' ? (STATUS_EN[v] || v) : v; }
function trBrand(v) { return currentLang === 'en' ? (BRAND_EN[v] || v) : v; }
function trSystem(v) { return currentLang === 'en' ? (SYSTEM_EN[v] || v) : v; }
function trDesc(v) { if (currentLang !== 'en') return v;
  if (DESC_EN[v]) return DESC_EN[v];
  for (var key in DESC_EN) {
    if (v.indexOf(key.substring(0, 30)) === 0 || key.indexOf(v.substring(0, 30)) === 0) {
      return DESC_EN[key];
    }
  }
  return v; }
function trProgress(v) { return currentLang === 'en' ? (PROGRESS_EN[v] || v) : v; }

/* 获取当前语言的显示数据（不影响原始 DATA） */
function getDisplayData() {
  return DATA.map(function(r) {
    return [
      trDomain(r[0]),
      trDesc(r[1]),
      r[2], // priority 保持不变
      trStatus(r[3]),
      r[4], // proposer 保持不变
      trBrand(r[5]),
      r[6], // PM 保持不变
      trSystem(r[7]),
      trProgress(r[8])
    ];
  });
}

var statusMap = {"需求已上线":"badge-online","需求开发中":"badge-dev","需求确认中":"badge-confirm","需求已接收":"badge-received","需求拒绝":"badge-rejected","需求已合并":"badge-merged"};
var priMap = {"P0":"pri-p0","P1":"pri-p1","P2":"pri-p2","P3":"pri-p3"};

function countBy(arr, idx) { var m = {}; arr.forEach(function(r) { var v = r[idx] || "-"; m[v] = (m[v]||0)+1; }); return Object.entries(m).sort(function(a,b){return b[1]-a[1];}); }

function renderSummary(data) {
  var total = data.length;
  var online = data.filter(function(r){return r[3]==="需求已上线"||r[3]==="Live";}).length;
  var dev = data.filter(function(r){return r[3]==="需求开发中"||r[3]==="In Development";}).length;
  var received = data.filter(function(r){return r[3]==="需求已接收"||r[3]==="Received";}).length;
  var confirm = data.filter(function(r){return r[3]==="需求确认中"||r[3]==="Confirming";}).length;
  var rejected = data.filter(function(r){return r[3]==="需求拒绝"||r[3]==="Rejected";}).length;
  var merged = data.filter(function(r){return r[3]==="需求已合并"||r[3]==="Merged";}).length;
  document.getElementById("summaryRow").innerHTML =
    '<div class="summary-card"><div class="num num-blue">'+total+'</div><div class="label">'+t('sumTotal')+'</div></div>'+
    '<div class="summary-card"><div class="num num-green">'+online+'</div><div class="label">'+t('sumOnline')+'</div></div>'+
    '<div class="summary-card"><div class="num num-orange">'+dev+'</div><div class="label">'+t('sumDev')+'</div></div>'+
    '<div class="summary-card"><div class="num num-purple">'+received+'</div><div class="label">'+t('sumReceived')+'</div></div>'+
    '<div class="summary-card"><div class="num num-blue">'+confirm+'</div><div class="label">'+t('sumConfirm')+'</div></div>'+
    '<div class="summary-card"><div class="num num-red">'+rejected+'</div><div class="label">'+t('sumRejected')+'</div></div>'+
    '<div class="summary-card"><div class="num num-teal">'+merged+'</div><div class="label">'+t('sumMerged')+'</div></div>';
}

function renderBarChart(containerId, entries, colors) {
  var max = Math.max.apply(null, entries.map(function(e){return e[1];})) || 1;
  var el = document.getElementById(containerId);
  var html = "";
  for (var i = 0; i < entries.length; i++) {
    var label = entries[i][0], count = entries[i][1];
    var pct = (count/max*100).toFixed(0);
    var color = colors[i % colors.length];
    html += '<div class="bar-group"><div class="bar-label">'+label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'">'+count+'</div></div></div>';
  }
  el.innerHTML = html;
}

var barColors = ["#1a73e8","#0d9f4f","#e8850a","#d93025","#7b1fa2","#00897b","#f4511e","#6d4c41","#546e7a"];

function renderCharts(data) {
  renderBarChart("domainChart", countBy(data, 0), barColors);
  renderBarChart("statusChart", countBy(data, 3), ["#137333","#b06000","#7b1fa2","#1967d2","#c5221f","#00695c"]);
  renderBarChart("priorityChart", countBy(data, 2), ["#c5221f","#b06000","#1967d2","#666"]);
  renderBarChart("brandChart", countBy(data, 5), barColors);
}

function populateFilters() {
  var dSel = document.getElementById("filterDomain");
  var sSel = document.getElementById("filterStatus");
  var pSel = document.getElementById("filterPriority");

  // 保留第一个 option（全部），重置后面的
  while (dSel.children.length > 1) dSel.removeChild(dSel.lastChild);
  while (sSel.children.length > 1) sSel.removeChild(sSel.lastChild);
  while (pSel.children.length > 1) pSel.removeChild(pSel.lastChild);

  var domains = [], statuses = [], priorities = [];
  DATA.forEach(function(r) {
    if (domains.indexOf(r[0])<0) domains.push(r[0]);
    if (statuses.indexOf(r[3])<0) statuses.push(r[3]);
    if (priorities.indexOf(r[2])<0) priorities.push(r[2]);
  });
  domains.sort(); statuses.sort(); priorities.sort();
  domains.forEach(function(d) { var o = document.createElement("option"); o.value=d; o.textContent=trDomain(d); dSel.appendChild(o); });
  statuses.forEach(function(s) { var o = document.createElement("option"); o.value=s; o.textContent=trStatus(s); sSel.appendChild(o); });
  priorities.forEach(function(p) { var o = document.createElement("option"); o.value=p; o.textContent=p; pSel.appendChild(o); });
}

function renderTable(data) {
  var displayData = getDisplayData();

  // data 是过滤后的原始 DATA 子集，需要找到在 displayData 中对应的行
  var tbody = document.getElementById("tableBody");
  var html = "";
  for (var i = 0; i < data.length; i++) {
    var r = data[i];
    // 找到在原始 DATA 中的索引
    var origIdx = DATA.indexOf(r);
    var dr = displayData[origIdx] || r;

    var sc = statusMap[r[3]] || "badge-confirm";
    var pc = priMap[r[2]] || "pri-p3";
    var progressText = dr[8] && dr[8].length > 80 ? dr[8].substring(0,80)+"..." : (dr[8]||"-");

    if (isEditMode) {
      html += '<tr data-index="'+origIdx+'"><td>'+(i+1)+'</td>'+
        '<td contenteditable="true" data-field="0">'+dr[0]+'</td>'+
        '<td contenteditable="true" data-field="1" class="req-desc">'+dr[1]+'</td>'+
        '<td contenteditable="true" data-field="2"><span class="pri '+pc+'">'+dr[2]+'</span></td>'+
        '<td contenteditable="true" data-field="3"><span class="badge '+sc+'">'+dr[3]+'</span></td>'+
        '<td contenteditable="true" data-field="4">'+dr[4]+'</td>'+
        '<td contenteditable="true" data-field="5">'+dr[5]+'</td>'+
        '<td contenteditable="true" data-field="6">'+dr[6]+'</td>'+
        '<td contenteditable="true" data-field="7">'+dr[7]+'</td>'+
        '<td contenteditable="true" data-field="8" class="progress-cell">'+dr[8]+'</td></tr>';
    } else {
      html += '<tr><td>'+(i+1)+'</td><td><span class="domain-tag">'+dr[0]+'</span></td><td class="req-desc">'+dr[1]+'</td><td><span class="pri '+pc+'">'+dr[2]+'</span></td><td><span class="badge '+sc+'">'+dr[3]+'</span></td><td>'+dr[4]+'</td><td>'+dr[5]+'</td><td>'+dr[6]+'</td><td>'+dr[7]+'</td><td class="progress-cell" title="'+dr[8]+'">'+progressText+'</td></tr>';
    }
  }
  tbody.innerHTML = html;

  if (isEditMode) {
    tbody.querySelectorAll('td[contenteditable]').forEach(function(td) {
      td.addEventListener('blur', function() {
        var row = parseInt(this.parentElement.dataset.index);
        var field = parseInt(this.dataset.field);
        DATA[row][field] = this.textContent.trim();
      });
    });
  }
}

function applyFilters() {
  var d = document.getElementById("filterDomain").value;
  var s = document.getElementById("filterStatus").value;
  var p = document.getElementById("filterPriority").value;
  var q = document.getElementById("filterSearch").value.toLowerCase();
  var filtered = DATA.filter(function(r) {
    if (d && r[0] !== d) return false;
    if (s && r[3] !== s) return false;
    if (p && r[2] !== p) return false;
    if (q && r[1].toLowerCase().indexOf(q)<0 && r[4].toLowerCase().indexOf(q)<0) return false;
    return true;
  });

  // 对过滤后的数据应用翻译用于图表和摘要
  var displayFiltered = filtered.map(function(r) {
    var idx = DATA.indexOf(r);
    return [trDomain(r[0]), trDesc(r[1]), r[2], trStatus(r[3]), r[4], trBrand(r[5]), r[6], trSystem(r[7]), trProgress(r[8])];
  });

  renderSummary(displayFiltered);
  renderCharts(displayFiltered);
  renderTable(filtered);
}

// 编辑功能
function toggleEdit() {
  document.getElementById("passwordModal").classList.add("active");
  document.getElementById("passwordInput").focus();
}

function closePasswordModal() {
  document.getElementById("passwordModal").classList.remove("active");
  document.getElementById("passwordInput").value = "";
}

function checkPassword() {
  var pwd = document.getElementById("passwordInput").value;
  if (pwd === EDIT_PASSWORD) {
    closePasswordModal();
    enterEditMode();
  } else {
    alert(t('pwdError'));
    document.getElementById("passwordInput").value = "";
  }
}

function enterEditMode() {
  isEditMode = true;
  document.body.classList.add("edit-mode");
  document.getElementById("editBtn").style.display = "none";
  document.getElementById("saveBtn").style.display = "inline-block";
  document.getElementById("syncBtn").style.display = "inline-block";
  document.getElementById("cancelBtn").style.display = "inline-block";
  originalData = JSON.parse(JSON.stringify(DATA));
  applyFilters();
  showStatus(t('editModeEnter'), "info");
}

function cancelEdit() {
  if (confirm(t('cancelEditConfirm'))) {
    DATA = JSON.parse(JSON.stringify(originalData));
    exitEditMode();
  }
}

function exitEditMode() {
  isEditMode = false;
  document.body.classList.remove("edit-mode");
  document.getElementById("editBtn").style.display = "inline-block";
  document.getElementById("saveBtn").style.display = "none";
  document.getElementById("syncBtn").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";
  applyFilters();
}

function saveChanges() {
  saveToLocal();
  showStatus(t('saveLocalOk'), "success");
}

function syncToFeishu() {
  var fieldNames = [t('fieldDomain'),t('fieldDesc'),t('fieldPriority'),t('fieldStatus'),t('fieldProposer'),t('fieldBrand'),t('fieldPM'),t('fieldSystem'),t('fieldProgress')];
  var changes = [];
  for (var i = 0; i < DATA.length; i++) {
    for (var j = 0; j < DATA[i].length; j++) {
      if (DATA[i][j] !== originalData[i][j]) {
        changes.push({
          row: i + 3,
          col: j,
          field: fieldNames[j] || t('fieldUnknown'),
          oldValue: originalData[i][j],
          newValue: DATA[i][j]
        });
      }
    }
  }
  if (changes.length === 0) {
    showStatus(t('noChanges'), "info");
    return;
  }
  var exportData = {
    timestamp: new Date().toISOString(),
    changes: changes,
    fullData: DATA
  };
  var blob = new Blob([JSON.stringify(exportData, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'feishu_sync_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showStatus(t('syncExportOk'), "success");
  exitEditMode();
}

function showStatus(msg, type) {
  var el = document.getElementById("syncStatus");
  el.textContent = msg;
  el.className = "sync-status show " + type;
  setTimeout(function() {
    el.classList.remove("show");
  }, 5000);
}

// 初始化
try {
  loadData();
  applyLang();
  populateFilters();
  applyFilters();
} catch(e) {
  console.error('Init error:', e);
}
</script>
