<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
.header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 28px 40px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 26px; font-weight: 600; }
.header p { font-size: 14px; opacity: 0.85; margin-top: 6px; }
.header-actions { display: flex; gap: 10px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.btn-primary { background: white; color: #1a73e8; }
.btn-primary:hover { background: #f0f0f0; }
.btn-success { background: #0d9f4f; color: white; }
.btn-success:hover { background: #0b8a43; }
.btn-warning { background: #e8850a; color: white; }
.btn-warning:hover { background: #d47808; }
.btn-danger { background: #d93025; color: white; }
.btn-danger:hover { background: #c5221f; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
.summary-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
.summary-card .num { font-size: 36px; font-weight: 700; }
.summary-card .label { font-size: 13px; color: #666; margin-top: 4px; }
.num-blue { color: #1a73e8; }
.num-green { color: #0d9f4f; }
.num-orange { color: #e8850a; }
.num-red { color: #d93025; }
.num-purple { color: #7b1fa2; }
.num-teal { color: #00897b; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.chart-card h3 { font-size: 15px; color: #444; margin-bottom: 16px; }
.bar-group { margin-bottom: 10px; display: flex; align-items: center; }
.bar-label { width: 110px; font-size: 13px; color: #555; flex-shrink: 0; text-align: right; padding-right: 12px; }
.bar-track { flex: 1; height: 26px; background: #f0f0f0; border-radius: 13px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 13px; display: flex; align-items: center; padding-left: 10px; font-size: 12px; color: white; font-weight: 600; min-width: 30px; transition: width 0.6s ease; }
.filter-bar { background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.filter-bar label { font-size: 13px; color: #666; font-weight: 500; }
.filter-bar select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: white; }
.filter-bar input { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; width: 220px; }
.table-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: #f8f9fa; padding: 12px 10px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #e8eaed; white-space: nowrap; }
tbody td { padding: 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
tbody tr:hover { background: #f8f9ff; }
.req-desc { max-width: 260px; line-height: 1.5; }
.progress-cell { max-width: 300px; font-size: 12px; color: #555; line-height: 1.5; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge-online { background: #e6f4ea; color: #137333; }
.badge-dev { background: #fef7e0; color: #b06000; }
.badge-confirm { background: #e8f0fe; color: #1967d2; }
.badge-received { background: #f3e8fd; color: #7b1fa2; }
.badge-rejected { background: #fce8e6; color: #c5221f; }
.badge-merged { background: #e0f2f1; color: #00695c; }
.pri { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.pri-p0 { background: #fce8e6; color: #c5221f; }
.pri-p1 { background: #fef7e0; color: #b06000; }
.pri-p2 { background: #e8f0fe; color: #1967d2; }
.pri-p3 { background: #f0f0f0; color: #666; }
.domain-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: #f0f0f0; color: #555; }
.footer { text-align: center; padding: 20px; font-size: 12px; color: #999; }
@media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } .summary-row { grid-template-columns: repeat(3, 1fr); } }

/* 编辑模式样式 */
.edit-mode tbody td { cursor: text; }
.edit-mode tbody td:hover { background: #fff9c4; }
.edit-mode tbody td[contenteditable="true"] { outline: 2px solid #1a73e8; background: #fff9c4; }

  document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中文';
  document.title = t('title');
  applyFilters();
}

function toggleLanguage() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  applyLanguage();
}


// 从 localStorage 加载数据
function loadData() {
  var saved = localStorage.getItem('sa_dashboard_data');
  if (saved) {
    DATA = JSON.parse(saved);
  }
  originalData = JSON.parse(JSON.stringify(DATA));
}

// 保存数据到 localStorage
function saveToLocal() {
  localStorage.setItem('sa_dashboard_data', JSON.stringify(DATA));
}

var statusMap = {"需求已上线":"badge-online","需求开发中":"badge-dev","需求确认中":"badge-confirm","需求已接收":"badge-received","需求拒绝":"badge-rejected","需求已合并":"badge-merged"};
var priMap = {"P0":"pri-p0","P1":"pri-p1","P2":"pri-p2","P3":"pri-p3"};

function countBy(arr, idx) { var m = {}; arr.forEach(function(r) { var v = r[idx] || "-"; m[v] = (m[v]||0)+1; }); return Object.entries(m).sort(function(a,b){return b[1]-a[1];}); }

function renderSummary(data) { 
  var total = data.length; 
  var online = data.filter(function(r){return r[3]==="需求已上线";}).length; 
  var dev = data.filter(function(r){return r[3]==="需求开发中";}).length; 
  var received = data.filter(function(r){return r[3]==="需求已接收";}).length; 
  var confirm = data.filter(function(r){return r[3]==="需求确认中";}).length; 
  var rejected = data.filter(function(r){return r[3]==="需求拒绝";}).length; 
  var merged = data.filter(function(r){return r[3]==="需求已合并";}).length; 
  document.getElementById("summaryRow").innerHTML = 
    '<div class="summary-card"><div class="num num-blue">'+total+'</div><div class="label">'+t('totalReqs')+'</div></div>'+
    '<div class="summary-card"><div class="num num-green">'+online+'</div><div class="label">'+t('online')+'</div></div>'+
    '<div class="summary-card"><div class="num num-orange">'+dev+'</div><div class="label">'+t('dev')+'</div></div>'+
    '<div class="summary-card"><div class="num num-purple">'+received+'</div><div class="label">'+t('received')+'</div></div>'+
    '<div class="summary-card"><div class="num num-blue">'+confirm+'</div><div class="label">'+t('confirming')+'</div></div>'+
    '<div class="summary-card"><div class="num num-red">'+rejected+'</div><div class="label">'+t('rejected')+'</div></div>'+
    '<div class="summary-card"><div class="num num-teal">'+merged+'</div><div class="label">'+t('merged')+'</div></div>'; 
}

function renderBarChart(containerId, entries, colors) { 
  var max = Math.max.apply(null, entries.map(function(e){return e[1];})) || 1; 
  var el = document.getElementById(containerId); 
  var html = ""; 
  for (var i = 0; i < entries.length; i++) { 
    var label = entries[i][0], count = entries[i][1]; 
    var pct = (count/max*100).toFixed(0); 
    var color = colors[i % colors.length]; 
    html += '<div class="bar-group"><div class="bar-label">'+label+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'">'+count+'</div></div></div>'; 
  } 
  el.innerHTML = html; 
}

var barColors = ["#1a73e8","#0d9f4f","#e8850a","#d93025","#7b1fa2","#00897b","#f4511e","#6d4c41","#546e7a"];

function renderCharts(data) { 
  var domainData = countBy(data, 0).map(function(e) { return [tDomain(e[0]), e[1]]; });
  var statusData = countBy(data, 3).map(function(e) { return [tStatus(e[0]), e[1]]; });
  renderBarChart("domainChart", domainData, barColors); 
  renderBarChart("statusChart", statusData, ["#137333","#b06000","#7b1fa2","#1967d2","#c5221f","#00695c"]); 
  renderBarChart("priorityChart", countBy(data, 2), ["#c5221f","#b06000","#1967d2","#666"]); 
  renderBarChart("brandChart", countBy(data, 5), barColors); 
}

function populateFilters() { 
  var domains = [], statuses = [], priorities = []; 
  DATA.forEach(function(r) { 
    if (domains.indexOf(r[0])<0) domains.push(r[0]); 
    if (statuses.indexOf(r[3])<0) statuses.push(r[3]); 
    if (priorities.indexOf(r[2])<0) priorities.push(r[2]); 
  }); 
  domains.sort(); statuses.sort(); priorities.sort(); 
  var dSel = document.getElementById("filterDomain"); 
  // 保留第一个"全部"选项，清空其他
  while (dSel.options.length > 1) dSel.remove(1);
  domains.forEach(function(d) { var o = document.createElement("option"); o.value=d; o.textContent=tDomain(d); dSel.appendChild(o); }); 
  var sSel = document.getElementById("filterStatus"); 
  while (sSel.options.length > 1) sSel.remove(1);
  statuses.forEach(function(s) { var o = document.createElement("option"); o.value=s; o.textContent=tStatus(s); sSel.appendChild(o); }); 
  var pSel = document.getElementById("filterPriority"); 
  priorities.forEach(function(p) { var o = document.createElement("option"); o.value=p; o.textContent=p; pSel.appendChild(o); }); 
}

function renderTable(data) { 
  var tbody = document.getElementById("tableBody"); 
  var html = ""; 
  for (var i = 0; i < data.length; i++) { 
    var r = data[i]; 
    var sc = statusMap[r[3]] || "badge-confirm"; 
    var pc = priMap[r[2]] || "pri-p3"; 
    var progressText = r[8] && r[8].length > 80 ? r[8].substring(0,80)+"..." : (r[8]||"-"); 
    
    if (isEditMode) {
      html += '<tr data-index="'+i+'"><td>'+(i+1)+'</td>'+
        '<td contenteditable="true" data-field="0">'+tDomain(r[0])+'</td>'+
        '<td contenteditable="true" data-field="1" class="req-desc">'+tDesc(r[1])+'</td>'+
        '<td contenteditable="true" data-field="2"><span class="pri '+pc+'">'+r[2]+'</span></td>'+
        '<td contenteditable="true" data-field="3"><span class="badge '+sc+'">'+tStatus(r[3])+'</span></td>'+
        '<td contenteditable="true" data-field="4">'+r[4]+'</td>'+
        '<td contenteditable="true" data-field="5">'+tBrand(r[5])+'</td>'+
        '<td contenteditable="true" data-field="6">'+r[6]+'</td>'+
        '<td contenteditable="true" data-field="7">'+tSystem(r[7])+'</td>'+
        '<td contenteditable="true" data-field="8" class="progress-cell">'+tProgress(r[8])+'</td></tr>';
    } else {
      html += '<tr><td>'+(i+1)+'</td><td><span class="domain-tag">'+tDomain(r[0])+'</span></td><td class="req-desc">'+tDesc(r[1])+'</td><td><span class="pri '+pc+'">'+r[2]+'</span></td><td><span class="badge '+sc+'">'+tStatus(r[3])+'</span></td><td>'+r[4]+'</td><td>'+tBrand(r[5])+'</td><td>'+r[6]+'</td><td>'+tSystem(r[7])+'</td><td class="progress-cell" title="'+r[8]+'">'+tProgress(progressText)+'</td></tr>';
    }
  } 
  tbody.innerHTML = html; 
  
  // 编辑模式下绑定事件
  if (isEditMode) {
    tbody.querySelectorAll('td[contenteditable]').forEach(function(td) {
      td.addEventListener('blur', function() {
        var row = parseInt(this.parentElement.dataset.index);
        var field = parseInt(this.dataset.field);
        DATA[row][field] = this.textContent.trim();
      });
    });
  }
}

function applyFilters() { 
  var d = document.getElementById("filterDomain").value; 
  var s = document.getElementById("filterStatus").value; 
  var p = document.getElementById("filterPriority").value; 
  var q = document.getElementById("filterSearch").value.toLowerCase(); 
  var filtered = DATA.filter(function(r) { 
    if (d && r[0] !== d) return false; 
    if (s && r[3] !== s) return false; 
    if (p && r[2] !== p) return false; 
    if (q && r[1].toLowerCase().indexOf(q)<0 && r[4].toLowerCase().indexOf(q)<0) return false; 
    return true; 
  }); 
  renderSummary(filtered); 
  renderCharts(filtered); 
  renderTable(filtered); 
}

// 编辑功能
function toggleEdit() {
  document.getElementById("passwordModal").classList.add("active");
  document.getElementById("passwordInput").focus();
}

function closePasswordModal() {
  document.getElementById("passwordModal").classList.remove("active");
  document.getElementById("passwordInput").value = "";
}

function checkPassword() {
  var pwd = document.getElementById("passwordInput").value;
  if (pwd === EDIT_PASSWORD) {
    closePasswordModal();
    enterEditMode();
  } else {
    alert(t("wrongPwd"));
    document.getElementById("passwordInput").value = "";
  }
}

function enterEditMode() {
  isEditMode = true;
  document.body.classList.add("edit-mode");
  document.getElementById("editBtn").style.display = "none";
  document.getElementById("saveBtn").style.display = "inline-block";
  document.getElementById("syncBtn").style.display = "inline-block";
  document.getElementById("cancelBtn").style.display = "inline-block";
  originalData = JSON.parse(JSON.stringify(DATA));
  renderTable(DATA);
  showStatus(t("editModeMsg"), "info");
}

function cancelEdit() {
  if (confirm(t("cancelConfirm"))) {
    DATA = JSON.parse(JSON.stringify(originalData));
    exitEditMode();
  }
}

function exitEditMode() {
  isEditMode = false;
  document.body.classList.remove("edit-mode");
  document.getElementById("editBtn").style.display = "inline-block";
  document.getElementById("saveBtn").style.display = "none";
  document.getElementById("syncBtn").style.display = "none";
  document.getElementById("cancelBtn").style.display = "none";
  applyFilters();
}

function saveChanges() {
  saveToLocal();
  showStatus(t("savedMsg"), "success");
}

function syncToFeishu() {
  // DATA 数组索引对应的字段名
  var fieldNames = ["业务域","需求说明","优先级","状态","提出人","涉及品牌","产品经理","对应系统","当前进展"];
  
  // 生成修改记录
  var changes = [];
  for (var i = 0; i < DATA.length; i++) {
    for (var j = 0; j < DATA[i].length; j++) {
      if (DATA[i][j] !== originalData[i][j]) {
        changes.push({
          row: i + 3, // 飞书表格行号（从第3行开始）
          col: j,
          field: fieldNames[j] || "未知字段",
          oldValue: originalData[i][j],
          newValue: DATA[i][j]
        });
      }
    }
  }
  
  if (changes.length === 0) {
    showStatus(t("noChanges"), "info");
    return;
  }
  
  // 导出修改记录
  var exportData = {
    timestamp: new Date().toISOString(),
    changes: changes,
    fullData: DATA
  };
  
  var blob = new Blob([JSON.stringify(exportData, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'feishu_sync_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  
  showStatus(t("exportMsg"), "success");
  
  // 退出编辑模式
  exitEditMode();
}

function showStatus(msg, type) {
  var el = document.getElementById("syncStatus");
  el.textContent = msg;
  el.className = "sync-status show " + type;
  setTimeout(function() {
    el.classList.remove("show");
  }, 5000);
}

// 初始化
loadData();
document.getElementById("syncTime").textContent = new Date().toLocaleString('zh-CN');
renderSummary(DATA);
renderCharts(DATA);
populateFilters();
renderTable(DATA);
</script>
